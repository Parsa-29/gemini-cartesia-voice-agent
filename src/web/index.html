<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ხმოვანი აგენტი</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%2314b8a6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>ხმოვანი აგენტი</span>
      </div>
      <div class="topbar-right">
        <span id="meta" class="meta"></span>
        <button id="settings-button" class="icon-button" type="button" aria-label="პარამეტრები" title="პარამეტრები">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" />
            <circle cx="16" cy="6" r="2" />
            <circle cx="10" cy="12" r="2" />
            <circle cx="18" cy="18" r="2" />
          </svg>
          <span id="custom-badge" class="badge" hidden>შეცვლილი</span>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="stage" aria-label="ზარი">
        <button id="call-button" class="orb" type="button" data-phase="idle" disabled>
          <span class="orb-glow" aria-hidden="true"></span>
          <span class="orb-core" aria-hidden="true"></span>
          <span id="call-label" class="orb-label">დაწყება</span>
        </button>
        <p id="status" class="status" role="status">იტვირთება…</p>
        <div class="controls">
          <button id="mute-button" class="pill" type="button" hidden aria-pressed="false">მიკროფონის გათიშვა</button>
        </div>
        <p id="latency" class="latency" hidden></p>
      </section>

      <section class="transcript-panel" aria-label="საუბრის ტექსტი">
        <div id="transcript" class="transcript" aria-live="polite">
          <p id="empty" class="empty">აქ გამოჩნდება საუბრის ტექსტი.</p>
        </div>
      </section>
    </main>

    <div id="error" class="toast" role="alert" hidden></div>

    <dialog id="settings" class="settings">
      <form method="dialog" class="settings-form">
        <header class="settings-header">
          <h2>აგენტის პარამეტრები</h2>
          <button class="icon-button" value="cancel" aria-label="დახურვა">✕</button>
        </header>
        <p id="settings-note" class="settings-note">ცვლილებები შემდეგ ზარზე ამოქმედდება. ნაგულისხმევი მნიშვნელობები ფაილებიდან მოდის: <code>prompts/</code> და <code>.env</code>.</p>
        <label class="field">
          <span>სისტემური პრომპტი</span>
          <textarea id="field-prompt" rows="14" spellcheck="false"></textarea>
        </label>
        <label class="field">
          <span>მისალმება <small>(ცარიელი — აგენტი შენ გელოდება)</small></span>
          <input id="field-greeting" type="text" />
        </label>
        <div class="field-row">
          <label class="field">
            <span>Cartesia voice ID</span>
            <input id="field-voice" type="text" spellcheck="false" />
          </label>
          <label class="field field-speed">
            <span>სიჩქარე <output id="speed-value"></output></span>
            <input id="field-speed" type="range" min="0.6" max="1.5" step="0.05" />
          </label>
        </div>
        <footer class="settings-actions">
          <button id="reset-button" class="pill" type="button">ნაგულისხმევზე დაბრუნება</button>
          <button id="save-button" class="pill pill-primary" value="save">შენახვა</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
